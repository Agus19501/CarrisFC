<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#171513">
  <meta name="description" content="Partidos, plantilla y estadísticas de Carris FC.">
  <link rel="icon" type="image/jpeg" href="assets/carris-escudo.jpg">
  <title>Carris FC — Juntos en el campo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <a class="brand" href="#" data-page="inicio" aria-label="Carris FC, inicio">
        <img class="brand-crest" src="assets/carris-escudo.jpg" alt="">
        <span class="brand-copy"><strong>CARRIS <span>FC</span></strong><small>JUNTOS EN EL CAMPO</small></span>
      </a>

      <div class="side-label">CLUB</div>
      <nav class="main-nav" aria-label="Navegación principal">
        <button class="nav-link active" data-page="inicio"><span class="nav-icon">⌂</span>Inicio</button>
        <button class="nav-link" data-page="plantilla"><span class="nav-icon">♙</span>La plantilla</button>
        <button class="nav-link" data-page="partidos"><span class="nav-icon">◷</span>Partidos</button>
        <button class="nav-link" data-page="convocatorias"><span class="nav-icon">☷</span>Convocatorias</button>
        <button class="nav-link" data-page="historial"><span class="nav-icon">▦</span>Historial</button>
        <button class="nav-link" id="create-callup-nav" data-page="crear-convocatoria" hidden><span class="nav-icon">＋</span>Crear convocatoria</button>
      </nav>

      <div class="sidebar-bottom">
        <div class="sidebar-note">
          <span class="note-icon">✳</span>
          <strong>Un equipo.<br>Una misma pasión.</strong>
          <span>Desde el primer minuto.</span>
        </div>
        <button class="admin-button" id="admin-toggle"><span>⚙</span> <span id="admin-label">Acceso administrador</span></button>
        <div class="sidebar-foot"><span class="live-dot"></span> Temporada 2025 / 26</div>
      </div>
    </aside>

    <main class="main-content">
      <header class="topbar">
        <div class="breadcrumb"><span>CLUB</span><b>/</b><strong id="current-section">INICIO</strong></div>
        <div class="topbar-right">
          <span class="season-chip"><span class="live-dot"></span> Temporada 25/26</span>
          <button class="mobile-admin" id="mobile-admin" aria-label="Activar modo administrador">⚙</button>
          <img class="club-avatar" src="assets/carris-escudo.jpg" alt="Escudo de Carris FC">
        </div>
      </header>

      <div class="page-wrap">
        <section class="page active" id="page-inicio" aria-labelledby="welcome-title"></section>
        <section class="page" id="page-plantilla" aria-labelledby="squad-title"></section>
        <section class="page" id="page-partidos" aria-labelledby="matches-title"></section>
        <section class="page" id="page-convocatorias" aria-labelledby="calls-title"></section>
        <section class="page" id="page-historial" aria-labelledby="history-title"></section>
        <section class="page" id="page-crear-convocatoria" aria-labelledby="create-callup-title"></section>
      </div>
      <footer class="site-footer"><span>CARRIS FC</span><span>Hechos de equipo. Hechos de fútbol.</span><span>© 2025</span></footer>
    </main>
  </div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="app.js"></script>
</body>
</html>
